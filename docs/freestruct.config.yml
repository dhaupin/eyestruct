# freestruct config - consumed by the SEO post-build layer in
# .github/workflows/docs.yml. Discovery: repo-root cwd -> docs/freestruct.config.yml.
# site.name and site.url are required; everything else has a working default.
# Placeholders feed docs/_freestruct/inject-brand.html - mirrors the identity
# in docs/_config.yml (they cover the same values).
site:
  name: eyestruct Docs
  # ORIGIN ONLY - no path. page paths carry /eyestruct via basePath (below);
  # putting the path here too doubled every engine-computed URL
  # (https://docs.creadev.org/eyestruct/eyestruct/... in sitemap.xml + feed.xml,
  # both 404 live). freestruct joins site.url + basePath + slug.
  url: https://docs.creadev.org
  description: "Eyes for production agents - deterministic look, committed labs/.eyes/ visual memory, CI gates on unexplained drift."

# Author identity - ships as a schema.org Person under "founder" on the
# injected Organization JSON-LD block - the same ownership shape the
# product site and the family carry (gistory's config is the reference).
author:
  name: Creadev.org
  url: https://creadev.org

# Maintainer identity - custom JSON-LD appended after the built-in
# Organization + WebSite blocks (freestruct issue #25 hook, legacy list
# form). The missing-only gate keeps pages that arrive with their own
# ld+json untouched.
jsonLd:
  - "@type": Person
    name: dhaupin
    url: https://github.com/dhaupin
    jobTitle: eyestruct maintainer

twitter:
  card: summary_large_image
# og.type keeps the family's docs convention (article). og.image stays absent
# until the PNG set lands (og-image.png is documented adopter homework in
# MANIFEST.md) - an og:image pointing at a 404 is worse than none, and the
# engine drops an unset image cleanly. The layout no longer hand-writes the og
# set (see docs/_layouts/default.html) and this template carries the engine's
# FULL head set, so the day a value lands under og.image it reaches every page
# instead of starving behind the missing-only gate (freestruct#46; crashtest#42
# is the worked example). Add it as: image: https://eyestruct.creadev.org/og-image.png
og:
  type: article
# Template consumed by the layer: docs/_freestruct/inject-brand.html.

# The output tree is served under /eyestruct (Jekyll baseurl does the prefix;
# this strips it from the URLs freestruct computes - without it the strict
# link check resolves /eyestruct/... against the _site tree directly and
# fails every internal link). Same shape gistory's docs carry for /gistory.
basePath: /eyestruct

outputDir: _site

# linkCheck suspended until upstream lands (dhaupin/freestruct#32): the 1.1.0
# strict link checker resolves root-absolute hrefs (`/eyestruct/...`) against
# the artifact root with no basePath awareness, so every baseurl'd site in
# the family fails --strict on its own nav. Everything else the strict gate
# covers (single-prefix canonical/sitemap, og, noindex hygiene) stays on.
# Flip back to default (remove this line) when #32 ships in a pinned release.
linkCheck: false
