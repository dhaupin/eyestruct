name: test
# eyestruct's OWN battery, riding in-tree from move day (the mount borrowed
# gistory's ci.yml staging-hosts leg until then; the tar-move plan's injected
# change #1 is this file). Same two legs the host leg proves today:
#   npm test       - the node:test spine (smoke)
#   npm run check  - lint:docs && packs && lint:packs && conform:packs
# npm ci is hermetic against the shipped lockfile (packstruct@1.0.0 exact
# pin inside). Docs gates fail loudly on voice/links/frontmatter drift.
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 - the battery reads history now (check:trifecta
      # verifies CHANGELOG-cited commit hashes exist). The gistory-lock
      # receipt already taught a shallow checkout breaks parent-reaching:
      # same lesson, now in-lane. Without it, the freshness leg fails
      # GHOST_COMMIT on every cited HEAD~n hash.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run check
      # The raster gate, dogfooded: every committed renderable the sites
      # and the eyes home wear (icons) parses strict + rasterizes + clears
      # the byte-size floor. MVP-5 receipt; MISSING_RENDER refuses honestly
      # if the optional renderer ever stops installing.
      - run: npm run raster:gate
      # The crashtest leg, alongside the pack campaign: hostile argv, MCP
      # stdio frames, and ledger parse attacks against the real CLI (in-
      # process adjacency, zero network). Gate: exit 1 on a NEW EXPLOITED
      # finding or a REFUSED->EXPLOITED regression against the committed
      # labs/crashledger.json baseline - same explicit-adoption rule the
      # packledger carries. Determinism: fixed attack batches + seed.
      - run: npx crashtest run
