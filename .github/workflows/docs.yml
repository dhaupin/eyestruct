# eyestruct docs - a THIN caller of THE one docs lane (dhaupin/freestruct).
#
# The runbook (Jekyll, the hardened pagefind scrape, the pinned freestruct
# post-build layer, the optional crashtest dogfood campaign, the Pages upload,
# the main-gated deploy) lives ONCE in the lane. This file keeps only what is
# per-repo: the trigger, the permissions, the concurrency group, and the input
# pins that are this repo's. It used to be a hand-copied runbook (one of five),
# which is the drift the consolidation removed.
#
# This repo runs crashtest in .github/workflows/test.yml, so the lane's dogfood
# leg stays off here. ruby 3.4 (the Gemfile lock).
# The docs truth gates (npm run lint:docs) run in test.yml/ci.yml, not here:
# a workflow_call caller cannot carry extra steps, so they stay in the battery.
name: Deploy docs

on:
  push:
    branches: [main, staging]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    # Pinned to the lane's SHA (pins, never floats): a moving @main would let
    # the runbook change under us between runs.
    uses: dhaupin/freestruct/.github/workflows/docs-lane.yml@446c8a69e34eaf15dc20639b1f6083374de4e024 # main
    with:
      ruby-version: '3.4'
      freestruct-version: '1.2.0'
