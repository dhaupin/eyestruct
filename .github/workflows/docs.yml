# docs.yml - builds docs/ with Jekyll + freestruct + pagefind, then deploys
# to GitHub Pages. Frame ported from dhaupin/Gistory's own docs workflow
# (itself ported freestruct's dogfood runbook).
#
# The site lands at docs.creadev.org/eyestruct - the docs/_config.yml pins
# baseurl: "/eyestruct", so the Pages custom domain docs.creadev.org must be
# set in the repo's Pages settings once (one-time dashboard step; the
# workflow deploys the artifact regardless).
#
# Local: the docs build needs Ruby; `npm run lint:docs` is the node-only
# slice and runs everywhere.

name: Deploy docs

on:
  push:
    branches: [main, staging]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package-lock.json'
  workflow_dispatch:
# The staging rule (poststruct#32's canon, adopted at eyestruct#21): staging
# verifies here like main does, but the DOCS DEPLOY job is gated to main -
# once staging is in the trigger list, the trigger no longer keeps its
# content out of production; the deploy job's ref gate is that guard
# (`if: github.ref == 'refs/heads/main'`).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'

      - name: Install Ruby deps
        working-directory: docs
        run: bundle install

      - name: Build Jekyll
        working-directory: docs
        run: bundle exec jekyll build

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm deps (freestruct devDep for the consistency gate)
        run: npm ci --no-audit --no-fund

      - name: Docs consistency gate
        run: npm run lint:docs

      # --strict: broken links and dangerous tags fail the build.
      # NOTE: there is NO engine guard that de-duplicates a site.url which
      # already carries the path against basePath - the earlier claim here
      # ("the pagesUrlFor guard that keeps a single /eyestruct prefix") was
      # wrong: the live sitemap shipped doubled URLs
      # (docs.creadev.org/eyestruct/eyestruct/..., 404). The fix is
      # config-side - site.url MUST be origin-only (see
      # docs/freestruct.config.yml), with basePath carrying the prefix.
      - name: Run freestruct strict
        run: node node_modules/freestruct/bin/freestruct.mjs --strict

      # Pinned + cached: the pagefind npm package resolves a platform BINARY
      # at install (cost ~355s cold - the freestruct repo's measurement); a
      # cache hit skips it. Cache BOTH scopes or a hit ships a runner that
      # cannot find its binary.
      - name: Restore pagefind (indexer cache)
        id: pf
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules/pagefind
            node_modules/@pagefind
          key: pagefind-1.5.2-v2

      - name: Install Pagefind (cache misses only, pinned)
        if: ${{ steps.pf.outputs['cache-hit'] != 'true' }}
        run: npm install --no-save --no-audit --no-fund pagefind@1.5.2

      - name: Index search
        run: node node_modules/pagefind/lib/runner/bin.cjs --site docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/_site

  deploy:
    needs: build
    # The staging gate: build on main OR staging, deploy ONLY from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
